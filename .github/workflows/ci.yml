name: Distribution CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt -r dependencies/mcp/requirements.txt
      - run: ruff check hermes_kubernetes tests examples/instance/hermes.py
      - run: ruff format --check hermes_kubernetes tests examples/instance/hermes.py
      - run: python hermes_kubernetes/checks/publication.py
      - run: |
          python hermes_kubernetes/backup/tools.py --lock config/rclone.lock.json --destination "$RUNNER_TEMP/backup-tools/rclone"
          echo "$RUNNER_TEMP/backup-tools" >> "$GITHUB_PATH"
      - run: make validate test test-hermes
      - run: kubectl kustomize deploy/kubernetes > /tmp/hermes-kubernetes.yaml
