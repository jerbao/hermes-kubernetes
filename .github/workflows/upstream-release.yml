name: Review official Hermes release
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: hermes-upstream-review
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          mkdir -p .build
          python scripts/update_release.py --update-lock --output .build/upstream-release.json
      - run: |
          python runtime/install_backup_tool.py --lock config/rclone.lock.json --destination "$RUNNER_TEMP/backup-tools/rclone"
          echo "$RUNNER_TEMP/backup-tools" >> "$GITHUB_PATH"
      - name: Review changed source
        run: |
          if ! git diff --quiet -- upstream.lock.json; then
            make validate test test-hermes
          fi
      - name: Open upstream review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python distribution/update_pr.py --upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-upstream-review-${{ github.run_id }}
          path: .build/upstream-release.json
          if-no-files-found: ignore
  notify:
    needs: candidate
    if: always()
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/update-notification.yml
    with:
      status: ${{ needs.candidate.result }}
      incident: upstream
