name: Publish distribution release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Stable distribution version, e.g. v0.1.0
permissions:
  contents: read
  packages: write
concurrency:
  group: distribution-release-${{ github.ref }}
  cancel-in-progress: false
env:
  # Docker 29 (containerd image store) pushes an OCI index with a provenance attestation by default.
  # Kubelets then match the amd64/v2 platform entry and reject it; a plain manifest skips that match.
  BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python hermes_kubernetes/checks/publication.py
      - run: |
          python hermes_kubernetes/backup/tools.py --lock config/rclone.lock.json --destination "$RUNNER_TEMP/backup-tools/rclone"
          echo "$RUNNER_TEMP/backup-tools" >> "$GITHUB_PATH"
      - run: make validate test test-hermes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:git-$GITHUB_SHA"
          sh scripts/build_image.sh "$image"
          docker push "$image"
          mkdir -p .build/release
          docker inspect --format '{{index .RepoDigests 0}}' "$image" > .build/release/hermes.txt
          sh scripts/check_manifest.sh "$(cat .build/release/hermes.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-digest
          path: .build/release/hermes.txt
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r dependencies/mcp/requirements.txt
      - run: make test-mcp
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify both executor images
        run: |
          mkdir -p .build/release
          python -m hermes_kubernetes.project.image_context --component mcp --output .build/mcp-image
          for component in mcp mcp-codegraph; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-${component}:git-$GITHUB_SHA"
            options=()
            checks=()
            if [ "$component" = mcp-codegraph ]; then
              options=(--target codegraph)
              checks=(--codegraph)
            fi
            docker build --platform linux/amd64/v2 "${options[@]}" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" .build/mcp-image
            python tests/executors/test_image.py "$image" "${checks[@]}"
            docker push "$image"
            docker inspect --format '{{index .RepoDigests 0}}' "$image" > ".build/release/$component.txt"
            sh scripts/check_manifest.sh "$(cat ".build/release/$component.txt")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-digests
          path: .build/release/*.txt
  publish:
    needs: [hermes, mcp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-digest*'
          path: .build/release
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: python hermes_kubernetes/releases/publisher.py --version "$VERSION" --digests .build/release
  notify:
    needs: [hermes, mcp, publish]
    if: always()
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/update-notification.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
      incident: image
