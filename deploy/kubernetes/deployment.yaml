apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      shareProcessNamespace: true
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare-state
        image: hermes-personal:initial
        command:
        - /opt/hermes/.venv/bin/python
        - -c
        - from pathlib import Path; home = Path('/state/home'); home.mkdir(mode=0o700,
          exist_ok=True); home.chmod(0o700)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: state
          mountPath: /state
        env:
        - name: TZ
          value: UTC
      containers:
      - name: gateway
        image: hermes-personal:initial
        args:
        - gateway
        securityContext: &id001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '4'
            memory: 6Gi
        startupProbe:
          exec:
            command:
            - /opt/hermes/.venv/bin/python
            - /opt/hermes-personal/hermes_kubernetes/runtime/health.py
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /opt/hermes/.venv/bin/python
            - /opt/hermes-personal/hermes_kubernetes/runtime/health.py
          periodSeconds: 15
        volumeMounts:
        - &id002
          name: state
          mountPath: /opt/data
          subPath: home
        - &id003
          name: policy
          mountPath: /etc/hermes-policy
          readOnly: true
        - &id004
          name: ssh
          mountPath: /opt/hermes-ssh
          readOnly: true
        - &id005
          name: tmp
          mountPath: /tmp
        env:
        - name: TZ
          value: UTC
      - name: dashboard
        image: hermes-personal:initial
        args:
        - dashboard
        ports:
        - name: dashboard
          containerPort: 9119
        securityContext: *id001
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          tcpSocket:
            port: dashboard
          initialDelaySeconds: 15
        volumeMounts:
        - *id002
        - *id003
        - *id004
        - *id005
        env:
        - name: TZ
          value: UTC
      - name: diagnostics
        image: hermes-personal:initial
        command:
        - /opt/hermes/.venv/bin/python
        - /opt/hermes-personal/hermes_kubernetes/terminal/diagnostics.py
        securityContext: *id001
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: state
          mountPath: /opt/data
          subPath: home
          readOnly: true
        - name: policy
          mountPath: /etc/hermes-policy
          readOnly: true
        - name: ssh
          mountPath: /opt/hermes-ssh
          readOnly: true
        - name: tmp
          mountPath: /tmp
        env:
        - name: TZ
          value: UTC
      - name: operations
        image: hermes-personal:initial
        command:
        - /opt/hermes/.venv/bin/python
        - /opt/hermes-personal/hermes_kubernetes/operations/server.py
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          exec:
            command:
            - /opt/hermes/.venv/bin/python
            - /opt/hermes-personal/hermes_kubernetes/operations/server.py
            - --health
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /opt/hermes/.venv/bin/python
            - /opt/hermes-personal/hermes_kubernetes/operations/server.py
            - --health
          periodSeconds: 15
        volumeMounts:
        - *id002
        - *id003
        - *id004
        - *id005
        env:
        - name: TZ
          value: UTC
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: hermes-state
      - name: policy
        projected:
          defaultMode: 288
          sources:
          - configMap:
              name: hermes-policy
          - secret:
              name: hermes-runtime-env
              items:
              - key: .env
                path: .env
      - name: ssh
        secret:
          secretName: hermes-ssh
          defaultMode: 288
      - name: tmp
        emptyDir:
          sizeLimit: 6Gi
