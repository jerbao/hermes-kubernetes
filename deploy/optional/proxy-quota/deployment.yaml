apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
spec:
  template:
    spec:
      initContainers:
      - name: management-config
        image: hermes-personal:initial
        command:
        - /opt/hermes/.venv/bin/python
        - -m
        - hermes_kubernetes.quota.configuration
        - --source
        - /source/config.yaml
        - --key-file
        - /quota-key/key
        - --output
        - /runtime/config.yaml
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        volumeMounts:
        - name: config
          mountPath: /source
          readOnly: true
        - name: quota-key
          mountPath: /quota-key
          readOnly: true
        - name: management-config
          mountPath: /runtime
      containers:
      - name: cli-proxy-api
        command:
        - ./CLIProxyAPI
        - -config
        - /runtime/config.yaml
        volumeMounts:
        - name: management-config
          mountPath: /runtime
      - name: quota
        image: hermes-personal:initial
        command:
        - /opt/hermes/.venv/bin/python
        - -m
        - hermes_kubernetes.quota.server
        - --key-file
        - /quota-key/key
        ports:
        - name: quota
          containerPort: 8318
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: quota}
        livenessProbe:
          httpGet: {path: /healthz, port: quota}
        volumeMounts:
        - name: quota-key
          mountPath: /quota-key
          readOnly: true
      volumes:
      - name: quota-key
        secret:
          secretName: cli-proxy-quota
          defaultMode: 0444
      - name: management-config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
